[project]
name = "pocketwatcher"
version = "0.1.0"
description = "Read-only cost guardrails and alerts for Databricks workspaces"
readme = "README.md"
authors = [
    { name = "DineshGudapati", email = "dineshgudapati7@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
    "databricks-sdk>=0.40",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
    "uvicorn>=0.54.0",
    "workos>=10.6.0",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "duckdb>=2.0.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
packages = ["pocketwatcher"]
ignore_missing_imports = true
